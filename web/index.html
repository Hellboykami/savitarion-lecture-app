<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="app-token" content="__APP_TOKEN__">
<meta name="app-mode" content="__APP_MODE__">
<title>Расшифровка лекций</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>Расшифровка лекций</h1>
    <span id="demo-badge" class="badge" hidden>демо: распознавание имитируется</span>
  </div>
  <p class="keep-open">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></svg>
    <span>Окно Терминала с приложением не закрывайте — это выключит приложение и остановит расшифровку.</span>
  </p>
</header>
<div id="problems"></div>
<main class="layout">
  <div class="col-work">
    <section id="drop" class="drop" aria-label="Материалы новой лекции">
      <svg class="icon drop-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 14v4.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V14M12 4v11M8 11l4 4 4-4"/></svg>
      <p class="drop-title">Перетащите сюда материалы одной лекции</p>
      <p class="drop-hint">Запись, конспекты, фото слайдов — сразу, по одному или целой папкой.</p>
      <p class="drop-actions">
        <label class="button secondary">Выбрать файлы<input id="picker" class="sr-only" type="file" multiple></label>
        <button id="new-card" type="button" class="secondary" hidden>Ещё одна лекция</button>
      </p>
    </section>
    <section id="cards" aria-label="Лекции перед запуском"></section>
    <details id="settings-box" class="settings">
      <summary>Настройки</summary>
      <div id="settings"></div>
    </details>
  </div>
  <div class="col-status">
    <section class="block" aria-labelledby="queue-title">
      <h2 id="queue-title">Очередь</h2>
      <div id="queue"></div>
    </section>
    <section class="block" aria-labelledby="done-title">
      <h2 id="done-title">Готово</h2>
      <div id="done" class="done-list"></div>
    </section>
  </div>
</main>
<div id="message" class="message" role="status" aria-live="polite" hidden></div>
<template id="icons">
  <svg data-icon="x" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 7l10 10M17 7L7 17"/></svg>
  <svg data-icon="up" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 18V6M7 11l5-5 5 5"/></svg>
  <svg data-icon="down" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 6v12M7 13l5 5 5-5"/></svg>
  <svg data-icon="folder" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 7.5A1.5 1.5 0 0 1 5 6h4l2 2h8a1.5 1.5 0 0 1 1.5 1.5v8A1.5 1.5 0 0 1 19 19H5a1.5 1.5 0 0 1-1.5-1.5z"/></svg>
  <svg data-icon="alert" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 9.5v4M12 17h.01M10.3 4.6L3 17.3a2 2 0 0 0 1.7 3h14.6a2 2 0 0 0 1.7-3L13.7 4.6a2 2 0 0 0-3.4 0z"/></svg>
  <svg data-icon="moon" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19.5 14.2A7.5 7.5 0 1 1 9.8 4.5a6 6 0 0 0 9.7 9.7z"/></svg>
</template>
<script src="/app.js"></script>
<script src="/cards.js"></script>
</body>
</html>
